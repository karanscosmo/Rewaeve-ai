<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "on-error-container": "#93000a",

                        "on-tertiary-fixed-variant": "#005140",

                        "tertiary": "#006b56",
                        "secondary-fixed": "#65f8ed",
                        "secondary-fixed-dim": "#40dcd1",
                        "on-surface": "#171d1a",
                        "on-primary-fixed-variant": "#00513d",
                        "on-secondary-fixed-variant": "#00504b",
                        "on-primary": "#ffffff",
                        "on-tertiary-container": "#00765f"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",

                        "full": "9999px"

                    "spacing": {
                        "module-gap": "2rem",
                        "glass-blur": "24px",
                        "internal-padding": "1.5rem",
                        "safe-area": "4rem"
                    },
                    "fontFamily": {
                        "display-hero": ["Inter"],
                        "headline-lg": ["Inter"],
                        "metadata": ["Inter"],
                        "body-large": ["Inter"],
                        "headline-md": ["Inter"],

                        "label-caps": ["Inter"]

                    "fontSize": {
                        "display-hero": ["72px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "300" }],

                        "metadata": ["13px", { "lineHeight": "1.4", "letterSpacing": "0.02em", "fontWeight": "400" }],
                        "body-large": ["18px", { "lineHeight": "1.6", "letterSpacing": "0.01em", "fontWeight": "400" }],

<style>
        .backdrop-blur-glass {
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .bg-holographic-gradient {
            background: radial-gradient(circle at 50% 50%, rgba(127, 255, 212, 0.1) 0%, rgba(244, 251, 246, 0) 70%);
        }
        .hover-holographic-glow:hover {
            box-shadow: 0 0 20px rgba(76, 242, 194, 0.2);
            border-color: #7FFFD4;
            transform: scale(1.02);
        }
        .role-card:hover .role-icon {
            color: #7FFFD4;
            text-shadow: 0 0 10px rgba(127, 255, 212, 0.5);
        }
        .input-glow:focus {
            box-shadow: 0 0 15px rgba(127, 255, 212, 0.3);
            border-color: #7FFFD4;
            outline: none;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen relative overflow-hidden flex items-center justify-center font-body-main">
<!-- Atmospheric Background & 3D Orb Visualization -->
<div class="absolute inset-0 z-0 bg-gradient-to-br from-surface-bright to-surface-container-low">
<div class="absolute inset-0 bg-holographic-gradient opacity-80 mix-blend-screen pointer-events-none transition-colors duration-1000" id="bg-ambient-glow"></div>
<div class="absolute inset-0 opacity-30" style="background-image: url('data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg fill=\'none\' fill-rule=\'evenodd\'%3E%3Cg fill=\'%23bccac2\' fill-opacity=\'0.2\'%3E%3Cpath d=\'M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z\'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');"></div>
<!-- Large Floating Orb -->
<div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] rounded-full bg-gradient-to-tr from-primary-container/20 to-secondary-container/20 blur-3xl mix-blend-multiply opacity-60"></div>
<div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] rounded-full bg-gradient-to-br from-surface/50 to-surface-variant/50 backdrop-blur-3xl border border-outline-variant/30 shadow-[0_0_50px_rgba(76,242,194,0.15)] flex items-center justify-center">
<!-- Simulated Core Structure -->
<div class="w-64 h-64 rounded-full border border-primary/20 animate-pulse flex items-center justify-center">
<div class="w-48 h-48 rounded-full border border-secondary/20 flex items-center justify-center">
<span class="material-symbols-outlined text-6xl text-primary/40" style="font-variation-settings: 'FILL' 0;">all_inclusive</span>
</div>
</div>
</div>
</div>
<!-- Main Authentication Canvas -->
<main class="relative z-10 w-full max-w-[1200px] mx-safe-area flex flex-col lg:flex-row gap-module-gap items-center justify-center">
<!-- Branding & Intro Panel -->
<div class="w-full lg:w-5/12 flex flex-col items-center lg:items-start text-center lg:text-left space-y-6">
<h1 class="font-display-hero text-display-hero text-primary tracking-tighter">
                ReWeave AI
            </h1>
<p class="font-headline-md text-headline-md text-on-surface-variant max-w-md">
                The Operating System for Industrial Circular Intelligence
            </p>
<div class="inline-flex items-center gap-2 bg-surface/40 backdrop-blur-glass border border-outline-variant/20 rounded-full px-4 py-2 shadow-sm">
<span class="w-2 h-2 rounded-full bg-primary-fixed animate-pulse"></span>
<span class="font-metadata text-metadata text-on-surface-variant">System Core Online</span>
</div>
</div>
<!-- Authentication & Role Glass Panel -->
<div class="w-full lg:w-7/12 bg-surface/50 backdrop-blur-glass border border-[#7A928A]/20 rounded-2xl p-8 lg:p-12 shadow-[0_0_40px_rgba(0,0,0,0.05)] relative overflow-hidden">
<!-- Inner subtle glow top right -->
<div class="absolute -top-20 -right-20 w-40 h-40 bg-primary-container/30 rounded-full blur-2xl"></div>
<div class="relative z-10 flex flex-col gap-8">
<!-- Tab Switching -->
<div class="flex gap-4 border-b border-outline-variant/20 pb-4">
<button class="font-headline-md text-headline-md text-primary font-bold border-b-2 border-primary pb-1 -mb-[17px] px-2 transition-colors">Connect</button>
<button class="font-headline-md text-headline-md text-on-surface-variant font-medium pb-1 px-2 hover:text-secondary transition-colors">Initialize Node</button>
</div>
<!-- Credential Input -->
<div class="space-y-4">
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50">fingerprint</span>
<input class="w-full bg-surface-container-low border border-outline-variant/30 rounded-xl py-4 pl-12 pr-4 font-body-main text-body-main text-on-surface input-glow transition-all placeholder:text-on-surface-variant/50" placeholder="Biometric Identity or Access Key" type="text"/>
</div>
<button class="w-full bg-transparent border border-primary/40 rounded-xl py-4 font-body-main text-body-main font-semibold text-primary hover-holographic-glow flex justify-center items-center gap-2 relative overflow-hidden group">
<div class="absolute inset-0 bg-gradient-to-r from-primary-container/0 via-primary-container/20 to-primary-container/0 opacity-0 group-hover:opacity-100 transition-opacity duration-500 transform -translate-x-full group-hover:translate-x-full"></div>
<span class="material-symbols-outlined">vpn_key</span>
                        Secure Access
                    </button>
</div>
<div class="flex items-center gap-4">
<div class="h-px bg-outline-variant/20 flex-1"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant">OR SELECT ECOSYSTEM ROLE</span>
<div class="h-px bg-outline-variant/20 flex-1"></div>
</div>
<!-- Role Selection Bento Grid -->
<div class="grid grid-cols-2 gap-4">
<!-- Role: Manufacturer -->
<button class="role-card flex flex-col items-center justify-center gap-3 p-6 bg-surface/40 border border-outline-variant/20 rounded-xl hover-holographic-glow text-center group transition-all">
<span class="material-symbols-outlined text-4xl text-on-surface-variant role-icon transition-colors">precision_manufacturing</span>
<span class="font-body-large text-body-large text-on-surface font-medium group-hover:text-primary transition-colors">Manufacturer</span>
</button>
<!-- Role: Recycler -->
<button class="role-card flex flex-col items-center justify-center gap-3 p-6 bg-surface/40 border border-outline-variant/20 rounded-xl hover-holographic-glow text-center group transition-all">
<span class="material-symbols-outlined text-4xl text-on-surface-variant role-icon transition-colors">recycling</span>
<span class="font-body-large text-body-large text-on-surface font-medium group-hover:text-primary transition-colors">Recycler</span>
</button>
<!-- Role: Buyer -->
<button class="role-card flex flex-col items-center justify-center gap-3 p-6 bg-surface/40 border border-outline-variant/20 rounded-xl hover-holographic-glow text-center group transition-all">
<span class="material-symbols-outlined text-4xl text-on-surface-variant role-icon transition-colors">shopping_cart</span>
<span class="font-body-large text-body-large text-on-surface font-medium group-hover:text-primary transition-colors">Buyer</span>
</button>
<!-- Role: Treatment Provider -->
<button class="role-card flex flex-col items-center justify-center gap-3 p-6 bg-surface/40 border border-outline-variant/20 rounded-xl hover-holographic-glow text-center group transition-all">
<span class="material-symbols-outlined text-4xl text-on-surface-variant role-icon transition-colors">science</span>
<span class="font-body-large text-body-large text-on-surface font-medium group-hover:text-primary transition-colors">Treatment Provider</span>
</button>
</div>
</div>
</div>
</main>
</body></html>
