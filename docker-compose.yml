version: '3.9'
services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - '8000:8000'
    env_file:
      - .env
    depends_on:
      - db
      - redis
  frontend:
    build: ./frontend
    command: yarn dev --hostname 0.0.0.0 --port 3000
    volumes:
      - ./frontend:/app
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      - backend
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: reweave
      POSTGRES_USER: reweave
      POSTGRES_PASSWORD: reweave
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
  redis:
    image: redis:7
    ports:
      - '6379:6379'
  celery:
    build: ./backend
    command: celery -A app.tasks worker --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - backend
      - redis
volumes:
  db_data:
